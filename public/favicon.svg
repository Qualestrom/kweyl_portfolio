<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A0F1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  
  <!-- Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#0A0F1C" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="22" fill="url(#starGlow)" opacity="0.25"/>

  <!-- 4-Pointed Celestial Star / Cryo Diamond -->
  <path d="M 32 8 Q 32 26 14 32 Q 32 38 32 56 Q 32 38 50 32 Q 32 26 32 8 Z" fill="url(#crystalGrad)" filter="drop-shadow(0 0 6px rgba(103, 232, 249, 0.8))"/>

